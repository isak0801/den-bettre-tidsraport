name: Snölarm

on:
  schedule:
    - cron: '7 * * * *'   # varje timme (UTC)
  workflow_dispatch:       # kör manuellt från fliken Actions
    inputs:
      test:
        description: 'Skicka testnotis till alla'
        type: boolean
        default: false

jobs:
  kolla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node kolla.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
          TEST: ${{ inputs.test && '1' || '0' }}
